<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Riptide</title>
<style>
  html, body { margin: 0; height: 100%; background: #0f1013; color: #c9ccd3; font: 13px/1.45 system-ui, -apple-system, sans-serif; }
  iframe { border: 0; width: 100%; height: 100%; display: block; }
  .bar { position: absolute; right: 10px; bottom: 10px; display: flex; gap: 6px; }
  .bar a { color: inherit; text-decoration: none; background: rgba(20, 22, 28, .82); border: 1px solid rgba(255, 255, 255, .12); border-radius: 8px; padding: 4px 9px; font-size: 12px; backdrop-filter: blur(6px); }
  .bar a:hover { border-color: rgba(255, 255, 255, .3); }
</style></head>
<body>
<!-- Riptide's editor beside a Flash chat: each chat its own window (flash- and the chat's id), so what Flash makes in
     a chat lands here, and switching chats switches windows. The project of each is kept, as in any Riptide window. -->
<iframe id="editor" title="Riptide" allow="clipboard-read; clipboard-write; fullscreen; autoplay"></iframe>
<div class="bar"><a id="pop" href="#" target="_blank" rel="noopener" title="Open this window of Riptide on its own">Open on its own</a></div>
<script>
  const q = new URLSearchParams(location.search);
  const base = (q.get('riptide') || 'http://127.0.0.1:5173').replace(/\/+$/, '');
  const F = window.parent && window.parent.Flash;
  const frame = document.getElementById('editor'), pop = document.getElementById('pop');
  let shown = '';
  function windowFor(chat) { return chat && /^[0-9a-f]{8}/.test(chat) ? 'flash-' + chat.slice(0, 8) : (q.get('window') || 'flash'); }
  function show(chat) {
    const id = windowFor(chat);
    if (id === shown) return;
    shown = id;
    const url = `${base}/?window=${encodeURIComponent(id)}`;
    frame.src = url; pop.href = url;
  }
  show(F && F.chat ? (F.chat() || {}).id : '');
  if (F && F.on) F.on('chat-open', (e) => show(e.chat));
</script>
</body></html>
